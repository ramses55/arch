<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запуск</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f9f9f9;
        }
        button {
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            background-color: #0070f3;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0, 112, 243, 0.3);
            transition: background-color 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: #0051cb;
        }
        button:active {
            transform: scale(0.98);
        }
        /* Стили для заблокированной кнопки */
        button:disabled {
            background-color: #a0aec0;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        #status {
            margin-top: 20px;
            font-size: 15px;
            font-weight: 500;
            color: #555;
        }
    </style>
</head>
<body>

    <!-- Скрытый фрейм, куда форма отправит ответ от Yandex Cloud -->
    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="onFormSubmit()"></iframe>

    <form action="https://serverless-workflows.api.cloud.yandex.net/workflows/v1/execution/dfqgbq5tu74fcd0lk3qk/start" method="POST" target="hidden_iframe" id="workflowForm">
        <button type="submit" id="runBtn">Запустить процесс</button>
    </form>
    
    <div id="status">Нажмите кнопку для запуска</div>

    <script>
        let isSubmitting = false;
        let submitTimeout = null;
        
        document.getElementById('workflowForm').onsubmit = function(e) {
            if (isSubmitting) {
                e.preventDefault();
                return false;
            }
        
            isSubmitting = true;
        
            const btn = document.getElementById('runBtn');
            const status = document.getElementById('status');
            
            btn.disabled = true;
            status.style.color = '#555';
            status.innerText = 'Запрос отправлен в облако...';
        
            // Блокируем строго на 5 секунд
            submitTimeout = setTimeout(() => {
                isSubmitting = false;
                btn.disabled = false;
                status.style.color = '#555';
                status.innerText = 'Можно запустить снова';
            }, 10000);
        };
        
        function onFormSubmit() {
            // Игнорируем первичную загрузку iframe при старте страницы
            if (!isSubmitting) return;
        
            const status = document.getElementById('status');
            status.style.color = '#0070f3';
            status.innerText = 'Запрос успешно ушел! Подождите перед повторным запуском...';
        }
    </script>

</body>
</html>
