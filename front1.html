<!DOCTYPE html>
<html>
<body>

<input type="file" id="fileInput" multiple style="display:none" />

<button onclick="openPicker()">Choose Files</button>
<button onclick="uploadFiles()">Upload</button>

<ul id="fileList"></ul>

<script>
let selectedFiles = [];

function openPicker() {
    document.getElementById("fileInput").click();
}

document.getElementById("fileInput").addEventListener("change", (e) => {
    selectedFiles = Array.from(e.target.files);

    const list = document.getElementById("fileList");
    list.innerHTML = "";

    selectedFiles.forEach(file => {
        const li = document.createElement("li");
        li.textContent = file.name;
        list.appendChild(li);
    });
});

async function uploadFiles() {
    if (selectedFiles.length === 0) {
        alert("No files selected");
        return;
    }

    for (let file of selectedFiles) {
        try {
            // 1️⃣ Get signed URL for THIS file
            const res = await fetch(
                `http://localhost:8000/image_url/${encodeURIComponent(file.name)}`,
                { method: "GET" }
            );

            const data = await res.json();
            const signedUrl = data.url;
	    console.log(signedUrl)

            // 2️⃣ Upload file directly to storage
            // 1. Add ALL fields from the signed policy

            const formData = new FormData();
            for (const [key, value] of Object.entries(data.fields)) {
              formData.append(key, value);
            }
            
            // 2. Add the file LAST

            formData.append("file", file);


            await fetch(signedUrl, {
                method: "POST", // must match backend signing
                //headers: {
                //    "Content-Type": file.type
                //},
                body: formData
            });

            console.log(`Uploaded: ${file.name}`);

        } catch (err) {
            console.error(`Failed: ${file.name}`, err);
        }
    }

    alert("All uploads finished");
}
</script>



</body>
</html>
