<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Interactive Table</title>

  <!-- SheetJS for Excel export -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    input {
      margin-bottom: 10px;
      padding: 6px;
      width: 220px;
    }

    table {
      border-collapse: collapse;
      width: 70%;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      cursor: pointer;
    }

    th {
      background-color: #f4f4f4;
    }

    tr:hover {
      background-color: #f9f9f9;
    }

    button {
      margin: 10px 5px;
      padding: 6px 10px;
    }
  </style>
</head>

<body>
<a href="./front1.html">Upload</a>
<h2>Interactive Table</h2>

<input type="text" id="search" placeholder="Search...">

<div>
  <button onclick="downloadCSV()">Download CSV</button>
  <button onclick="downloadXLSX()">Download Excel</button>
</div>



<div>
  <button onclick="downloadImages()">Download Images</button>
</div>



<div>
  <button onclick="prevPage()">Prev</button>
  <button onclick="nextPage()">Next</button>
</div>


<div>
  <button onclick="loadData()">Update Table</button>
</div>


<div id="page-info"></div>


<label>Rows per page:</label>
<input type="number" id="rows-per-page" value="rowsPerPage" min="1" style="width: 80px;">

<table>
  <thead>
    <tr id="table-head"></tr>
  </thead>
  <tbody id="table-body"></tbody>
</table>



<script>
let globalData = [];
let currentPage = 1;
let rowsPerPage = 20;
let sortAsc = true;
let searchQuery = "";

// Fetch data
async function loadData() {
  const res = await fetch("http://localhost:8000/data");
  globalData = await res.json();
  renderTable();
}

// Render table
function renderTable() {
  const tbody = document.getElementById("table-body");
  const thead = document.getElementById("table-head");

  tbody.innerHTML = "";
  thead.innerHTML = "";

  if (globalData.length === 0) return;

  const columns = Object.keys(globalData[0]);

  // Filter data based on search
  const filteredData = globalData.filter(row =>
    Object.values(row).some(value =>
      value.toString().toLowerCase().includes(searchQuery)
    )
  );

  // Total pages
  const totalPages = Math.ceil(filteredData.length / rowsPerPage);

  // Pagination slice
  const start = (currentPage - 1) * rowsPerPage;
  const pageData = filteredData.slice(start, start + rowsPerPage);

  // Headers
  columns.forEach((col, index) => {
    const th = document.createElement("th");
    th.innerText = col;
    th.onclick = () => sortTable(index, filteredData);
    thead.appendChild(th);
  });

  // Rows
  pageData.forEach(row => {
    const tr = document.createElement("tr");

    columns.forEach(col => {
      const td = document.createElement("td");
      td.innerText = row[col];
      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  });

  // Page info
  document.getElementById("page-info").innerText =
    `Page ${currentPage} of ${totalPages} | ${filteredData.length} records`;
}

// Sorting
function sortTable(index, data) {
  const key = Object.keys(globalData[0])[index];

  data.sort((a, b) => {
    return sortAsc
      ? a[key].toString().localeCompare(b[key], undefined, { numeric: true })
      : b[key].toString().localeCompare(a[key], undefined, { numeric: true });
  });

  sortAsc = !sortAsc;
  renderTable();
}

// Pagination
function nextPage() {
  const filteredData = getFilteredData();
  const totalPages = Math.ceil(filteredData.length / rowsPerPage);

  if (currentPage < totalPages) {
    currentPage++;
    renderTable();
  }
}

function prevPage() {
  if (currentPage > 1) {
    currentPage--;
    renderTable();
  }
}

// Get filtered data (helper)
function getFilteredData() {
  return globalData.filter(row =>
    Object.values(row).some(value =>
      value.toString().toLowerCase().includes(searchQuery)
    )
  );
}

// Search (live sync)
document.getElementById("search").addEventListener("input", function () {
  searchQuery = this.value.toLowerCase();
  currentPage = 1;
  renderTable();
});

// CSV export (only searched)
function downloadCSV() {
  const filteredData = getFilteredData();

  if (filteredData.length === 0) return;

  const headers = Object.keys(filteredData[0]);
  let csv = headers.join(",") + "\n";

  filteredData.forEach(row => {
    const values = headers.map(h => `"${row[h]}"`);
    csv += values.join(",") + "\n";
  });

  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const link = document.createElement("a");

  link.href = URL.createObjectURL(blob);
  link.download = "filtered_table.csv";
  link.click();
}

// Excel export (only searched)
function downloadXLSX() {
  const filteredData = getFilteredData();

  if (filteredData.length === 0) return;

  const ws = XLSX.utils.json_to_sheet(filteredData);
  const wb = XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(wb, ws, "Table");

  XLSX.writeFile(wb, "filtered_table.xlsx");
}


// download images in zip file
function downloadImages(){
	let data = getFilteredData();
	file_names = data.map(item => item["file_name"]);
	fetch("http://localhost:8000/downloadImages", {
  		method: "POST",
  		headers: {
    			"Content-Type": "application/json"
  		},
  		body: JSON.stringify({ files: file_names })
		});
	console.log(file_names);
}


document.getElementById("rows-per-page").addEventListener("input", function () {
  rowsPerPage = parseInt(this.value) || 1;
  currentPage = 1; // reset to first page
  renderTable();
});

// Initial load
loadData();
</script>

</body>
</html>
